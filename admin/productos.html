<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Administración Vajillas y Chaskas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/auth-guard.js"></script>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
                <h4 class="text-warning mb-4">🏺 Chaskas Admin</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link text-white">📊 Dashboard</a></li>
                    <li class="nav-item"><a href="pedidos.html" class="nav-link text-white">📦 Pedidos</a></li>
                    <li class="nav-item"><a href="productos.html" class="nav-link text-white active bg-secondary rounded">🫕 Productos</a></li>
                    <li class="nav-item"><a href="usuarios.html" class="nav-link text-white" id="menuUsuarios">👥 Usuarios</a></li>
                    <li class="nav-item mt-4">
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-100">🚪 Cerrar Sesión</button>
                    </li>
                </ul>
            </nav>

            <!-- Contenido Principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">Catálogo de Productos</h1>
                    <div class="d-flex gap-2">
                        <!-- Botón para abrir el Modal de Nuevo Producto -->
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">+ Nuevo Producto</button>
                        <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">Salir</button>
                    </div>
                </div>

                <!-- Tabla de Productos -->
                <div class="card border-0 shadow-sm p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            <!-- Los productos se cargarán dinámicamente aquí -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para Agregar Nuevo Producto -->
    <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Agregar Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoProducto">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre del Producto</label>
                            <input type="text" id="nombreProd" class="form-control" placeholder="Ej. Taza Rústica" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Categoría</label>
                            <select id="categoriaProd" class="form-select">
                                <option value="Vajilla Unitaria">Vajilla Unitaria</option>
                                <option value="Juegos">Juegos</option>
                                <option value="Personalizados">Personalizados</option>
                                <option value="Accesorios">Accesorios</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Precio (S/)</label>
                            <input type="number" step="0.01" id="precioProd" class="form-control" placeholder="45.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Stock Disponible</label>
                            <input type="number" id="stockProd" class="form-control" placeholder="10" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica para Sesión, Productos y LocalStorage -->
    <script>
        // Función para cerrar sesión de forma segura
        function cerrarSesion() {
            localStorage.removeItem('adminLogueado');
            localStorage.removeItem('usuarioActivo');
            window.location.href = 'login.html';
        }

        const productosIniciales = [
            { nombre: "Plato Llano Artesanal", categoria: "Vajilla Unitaria", precio: "45.00", stock: 15 },
            { nombre: "Juego Dúo Azul Cobalto", categoria: "Juegos", precio: "240.00", stock: 8 }
        ];

        function cargarProductos() {
            let listaProd = JSON.parse(localStorage.getItem('listaProductosAdmin'));
            if (!listaProd) {
                listaProd = productosIniciales;
                localStorage.setItem('listaProductosAdmin', JSON.stringify(listaProd));
            }

            const tabla = document.getElementById('tablaProductos');
            tabla.innerHTML = '';

            listaProd.forEach((p, index) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>🏺</td>
                    <td>${p.nombre}</td>
                    <td>${p.categoria}</td>
                    <td>S/ ${parseFloat(p.precio).toFixed(2)}</td>
                    <td><span class="badge bg-success">${p.stock} en stock</span></td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${index})">Eliminar</button></td>
                `;
                tabla.appendChild(fila);
            });
        }

        document.getElementById('formNuevoProducto').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoProd = {
                nombre: document.getElementById('nombreProd').value,
                categoria: document.getElementById('categoriaProd').value,
                precio: document.getElementById('precioProd').value,
                stock: document.getElementById('stockProd').value
            };

            let listaProd = JSON.parse(localStorage.getItem('listaProductosAdmin')) || productosIniciales;
            listaProd.push(nuevoProd);
            localStorage.setItem('listaProductosAdmin', JSON.stringify(listaProd));

            cargarProductos();

            document.getElementById('formNuevoProducto').reset();
            const modalEl = document.getElementById('modalNuevoProducto');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            alert('¡Producto agregado con éxito!');
        });

        function eliminarProducto(index) {
            let listaProd = JSON.parse(localStorage.getItem('listaProductosAdmin'));
            if (confirm(`¿Estás seguro de eliminar el producto "${listaProd[index].nombre}"?`)) {
                listaProd.splice(index, 1);
                localStorage.setItem('listaProductosAdmin', JSON.stringify(listaProd));
                cargarProductos();
            }
        }

        window.onload = cargarProductos;
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
