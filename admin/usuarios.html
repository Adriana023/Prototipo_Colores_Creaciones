<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Administración Vajillas y Chaskas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/auth-guard.js"></script>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
                <h4 class="text-warning mb-4">🏺 Chaskas Admin</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link text-white">📊 Dashboard</a></li>
                    <li class="nav-item"><a href="pedidos.html" class="nav-link text-white">📦 Pedidos</a></li>
                    <li class="nav-item"><a href="productos.html" class="nav-link text-white">🫕 Productos</a></li>
                    <li class="nav-item"><a href="usuarios.html" class="nav-link text-white active bg-secondary rounded" id="menuUsuarios">👥 Usuarios</a></li>
                    <li class="nav-item mt-4">
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-100">🚪 Cerrar Sesión</button>
                    </li>
                </ul>
            </nav>

            <!-- Contenido Principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">Control de Usuarios y Roles</h1>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#modalRegistrarUsuario">+ Registrar Usuario</button>
                        <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">Salir</button>
                    </div>
                </div>

                <!-- Tabla de Usuarios -->
                <div class="card border-0 shadow-sm p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol Asignado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <!-- Los usuarios se cargarán aquí automáticamente -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para Registrar Nuevo Usuario -->
    <div class="modal fade" id="modalRegistrarUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoUsuario">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre Completo</label>
                            <input type="text" id="nombreUsuario" class="form-control" placeholder="Ej. Ana Torres" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Correo Electrónico</label>
                            <input type="email" id="correoUsuario" class="form-control" placeholder="ana@vajillas.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Rol Asignado</label>
                            <select id="rolUsuario" class="form-select">
                                <option value="Administrador">Administrador</option>
                                <option value="Editor">Editor</option>
                                <option value="Vendedor" selected>Vendedor</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para Guardar y Cargar desde localStorage -->
    <script>
        // Usuarios iniciales por defecto si no hay nada guardado
        const usuariosIniciales = [
            { nombre: "Administrador Principal", correo: "admin@vajillas.com", rol: "Administrador" },
            { nombre: "Editor de Contenido", correo: "editor@vajillas.com", rol: "Editor" }
        ];

        // Función para renderizar la tabla
        function cargarUsuarios() {
            let listaUsuarios = JSON.parse(localStorage.getItem('listaUsuariosAdmin'));
            
            if (!listaUsuarios) {
                listaUsuarios = usuariosIniciales;
                localStorage.setItem('listaUsuariosAdmin', JSON.stringify(listaUsuarios));
            }

            const tabla = document.getElementById('tablaUsuarios');
            tabla.innerHTML = '';

            listaUsuarios.forEach((user, index) => {
                let badgeClass = 'bg-secondary';
                if (user.rol === 'Administrador') badgeClass = 'bg-danger';
                else if (user.rol === 'Editor') badgeClass = 'bg-warning text-dark';
                else if (user.rol === 'Vendedor') badgeClass = 'bg-primary';

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${user.nombre}</td>
                    <td>${user.correo}</td>
                    <td><span class="badge ${badgeClass}">${user.rol}</span></td>
                    <td><button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuario(${index})">Eliminar</button></td>
                `;
                tabla.appendChild(fila);
            });
        }

        // Registrar nuevo usuario y guardar cambios
        document.getElementById('formNuevoUsuario').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevoUser = {
                nombre: document.getElementById('nombreUsuario').value,
                correo: document.getElementById('correoUsuario').value,
                rol: document.getElementById('rolUsuario').value
            };

            let listaUsuarios = JSON.parse(localStorage.getItem('listaUsuariosAdmin')) || usuariosIniciales;
            listaUsuarios.push(nuevoUser);
            localStorage.setItem('listaUsuariosAdmin', JSON.stringify(listaUsuarios));

            cargarUsuarios();

            document.getElementById('formNuevoUsuario').reset();
            const modalElement = document.getElementById('modalRegistrarUsuario');
            const modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();

            alert('¡Usuario guardado y registrado con éxito!');
        });

        // Función para eliminar usuario de la lista guardada
        function eliminarUsuario(index) {
            let listaUsuarios = JSON.parse(localStorage.getItem('listaUsuariosAdmin'));
            if (confirm(`¿Estás seguro de eliminar a ${listaUsuarios[index].nombre}?`)) {
                listaUsuarios.splice(index, 1);
                localStorage.setItem('listaUsuariosAdmin', JSON.stringify(listaUsuarios));
                cargarUsuarios();
            }
        }

        // Cargar los usuarios al abrir la página
        window.onload = cargarUsuarios;
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
