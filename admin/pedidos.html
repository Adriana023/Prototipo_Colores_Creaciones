<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Administración Vajillas y Chaskas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/auth-guard.js"></script>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
                <h4 class="text-warning mb-4">🏺 Chaskas Admin</h4>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link text-white">📊 Dashboard</a></li>
                    <li class="nav-item"><a href="pedidos.html" class="nav-link text-white active bg-secondary rounded">📦 Pedidos</a></li>
                    <li class="nav-item"><a href="productos.html" class="nav-link text-white">🫕 Productos</a></li>
                    <li class="nav-item"><a href="usuarios.html" class="nav-link text-white" id="menuUsuarios">👥 Usuarios</a></li>
                    <li class="nav-item mt-4">
                        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-100">🚪 Cerrar Sesión</button>
                    </li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">Gestión de Pedidos</h1>
                    <button onclick="cerrarSesion()" class="btn btn-danger btn-sm">Salir</button>
                </div>
                <div class="card border-0 shadow-sm p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th># ID</th>
                                <th>Cliente</th>
                                <th>Productos</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#1001</td>
                                <td>María García</td>
                                <td>Plato Llano (x1), Juego Dúo (x1)</td>
                                <td>S/ 285.00</td>
                                <td><span class="badge bg-warning text-dark">En preparación</span></td>
                                <td><button class="btn btn-sm btn-outline-dark">Ver detalle</button></td>
                            </tr>
                            <tr>
                                <td>#1002</td>
                                <td>Carlos Ruiz</td>
                                <td>Taza Rústica (x4)</td>
                                <td>S/ 128.00</td>
                                <td><span class="badge bg-success">Enviado</span></td>
                                <td><button class="btn btn-sm btn-outline-dark">Ver detalle</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
